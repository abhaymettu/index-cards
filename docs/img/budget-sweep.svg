<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 420' width='760' height='420' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif'><title>Accuracy by context budget</title><rect width='760' height='420' fill='#fcfcfb'/><text x='24' y='36' font-size='19' font-weight='600' fill='#0b0b0b'>Accuracy as the context budget grows</text><text x='24' y='60' font-size='13' fill='#52514e'>Held-out test split, 257 questions. Each line is one retriever; same answering model throughout.</text><line x1='64' x2='570' y1='364.0' y2='364.0' stroke='#e4e3df'/><text x='54' y='368.0' font-size='11' fill='#52514e' text-anchor='end'>60%</text><line x1='64' x2='570' y1='293.0' y2='293.0' stroke='#e4e3df'/><text x='54' y='297.0' font-size='11' fill='#52514e' text-anchor='end'>70%</text><line x1='64' x2='570' y1='222.0' y2='222.0' stroke='#e4e3df'/><text x='54' y='226.0' font-size='11' fill='#52514e' text-anchor='end'>80%</text><line x1='64' x2='570' y1='151.0' y2='151.0' stroke='#e4e3df'/><text x='54' y='155.0' font-size='11' fill='#52514e' text-anchor='end'>90%</text><line x1='64' x2='570' y1='80.0' y2='80.0' stroke='#e4e3df'/><text x='54' y='84.0' font-size='11' fill='#52514e' text-anchor='end'>100%</text><text x='64.0' y='390' font-size='11' fill='#52514e' text-anchor='middle'>1,000</text><text x='232.7' y='390' font-size='11' fill='#52514e' text-anchor='middle'>2,000</text><text x='401.3' y='390' font-size='11' fill='#52514e' text-anchor='middle'>4,000</text><text x='570.0' y='390' font-size='11' fill='#52514e' text-anchor='middle'>8,000</text><text x='317' y='410' font-size='11.5' fill='#52514e' text-anchor='middle'>context budget (tokens)</text><polyline points='64.0,276.1 232.7,190.5 401.3,154.6 570.0,140.8' fill='none' stroke='#2a78d6' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/><circle cx='64.0' cy='276.1' r='4.5' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><circle cx='232.7' cy='190.5' r='4.5' fill='#2a78d6' stroke='#fcfcf