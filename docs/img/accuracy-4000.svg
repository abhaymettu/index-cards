<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 452' width='760' height='452' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif'><title>Accuracy at 4000 tokens</title><rect width='760' height='452' fill='#fcfcfb'/><text x='24' y='36' font-size='19' font-weight='600' fill='#0b0b0b'>Accuracy at a 4,000-token context budget</text><text x='24' y='60' font-size='13' fill='#52514e'>Held-out test split, 257 questions over a 114k-token synthetic vault (seed 8). Same answering model and prompt; 95% CIs.</text><line x1='250.0' x2='250.0' y1='78' y2='412' stroke='#e4e3df'/><text x='250.0' y='432' font-size='11' fill='#52514e' text-anchor='middle'>0%</text><line x1='338.0' x2='338.0' y1='78' y2='412' stroke='#e4e3df'/><text x='338.0' y='432' font-size='11' fill='#52514e' text-anchor='middle'>20%</text><line x1='426.0' x2='426.0' y1='78' y2='412' stroke='#e4e3df'/><text x='426.0' y='432' font-size='11' fill='#52514e' text-anchor='middle'>40%</text><line x1='514.0' x2='514.0' y1='78' y2='412' stroke='#e4e3df'/><text x='514.0' y='432' font-size='11' fill='#52514e' text-anchor='middle'>60%</text><line x1='602.0' x2='602.0' y1='78' y2='412' stroke='#e4e3df'/><text x='602.0' y='432' font-size='11' fill='#52514e' text-anchor='middle'>80%</text><line x1='690.0' x2='690.0' y1='78' y2='412' stroke='#e4e3df'/><text x='690.0' y='432' font-size='11' fill='#52514e' text-anchor='middle'>100%</text><text x='238' y='105' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>No memory</text><rect x='250' y='92' width='34.2' height='18' rx='4' fill='#a8a7a1'/><line x1='272.4' x2='301.5' y1='101' y2='101' stroke='#0b0b0b' stroke-width='1.5' opacity='0.55'/><text x='309.5' y='105' font-size='12.5' fill='#0b0b0b' font-weight='400'>7.8%</text><text x='238' y='145' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>grep</text><rect x='250' y='132' width='323.6' height='18' rx='4' fill='#a8a7a1'/><line x1='548.5' x2='595.7' y1='141' y2='141' s